services:
  db:
    image: postgres:16-alpine
    container_name: slotwise-booking-db
    environment:
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: slotwise
      POSTGRES_DB: slotwise
    ports: ["5442:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotwise"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
